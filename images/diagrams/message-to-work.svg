<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="How a message becomes work" style="width:100%;height:auto;display:block"><title>A message in a channel becomes an event, is routed to one copy of a worker, which takes a turn and answers back where the event came from.</title><g><rect x="24" y="70" width="150" height="64" rx="10" fill="#ffffff" stroke="#282828" stroke-width="1.5"></rect><rect x="24" y="70" width="7" height="64" rx="3.5" fill="#00c5c5"></rect><text x="42" y="96" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#282828">Channel</text><text x="42" y="116" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#636666">#acme, a DM, a hook</text><g stroke="#8e9192" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="176" y1="102" x2="196" y2="102"></line><polyline points="188,107 196,102 188,97"></polyline></g></g><g><rect x="198" y="70" width="150" height="64" rx="10" fill="#ffffff" stroke="#282828" stroke-width="1.5"></rect><rect x="198" y="70" width="7" height="64" rx="3.5" fill="#3576d9"></rect><text x="216" y="96" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#282828">Event</text><text x="216" y="116" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#636666">a mention, a delivery, a schedule firing</text><g stroke="#8e9192" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="350" y1="102" x2="370" y2="102"></line><polyline points="362,107 370,102 362,97"></polyline></g></g><g><rect x="372" y="70" width="150" height="64" rx="10" fill="#ffffff" stroke="#282828" stroke-width="1.5"></rect><rect x="372" y="70" width="7" height="64" rx="3.5" fill="#947bff"></rect><text x="390" y="96" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#282828">Routing</text><text x="390" y="116" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#636666">which copy: Acme&#x27;s, Globex&#x27;s, your team&#x27;s</text><g stroke="#8e9192" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="524" y1="102" x2="544" y2="102"></line><polyline points="536,107 544,102 536,97"></polyline></g></g><g><rect x="546" y="70" width="150" height="64" rx="10" fill="#ffffff" stroke="#282828" stroke-width="1.5"></rect><rect x="546" y="70" width="7" height="64" rx="3.5" fill="#f456a9"></rect><text x="564" y="96" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#282828">Turn</text><text x="564" y="116" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" font-size="10.5" fill="#636666">that copy works, one event at a time</text></g><path d="M 621 136 V 170 H 99 V 144" fill="none" stroke="#8e9192" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="94,150 99,142 104,150" fill="none" stroke="#8e9192" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><text x="360" y="186" text-anchor="middle" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" font-size="11.5" fill="#636666">the answer goes back where the event came from</text><text x="24" y="40" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#8e9192">ONE MESSAGE, START TO FINISH</text></svg>
